<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080b10" />

    <title>Alec Stanley — technical portfolio</title>
    <meta
      name="description"
      content="Technical portfolio of Alec Stanley — aerospace engineering (Honours) and astrophysics at Monash University. CFD, orbital mechanics, simulation and robotics projects."
    />
    <meta name="author" content="Alec Stanley" />

    <!-- Absolute URLs: link-preview scrapers do not resolve relative paths, and
         most do not run JavaScript, so these stay static rather than being set
         per route by the router. Update all four if the site moves to a custom
         domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alec Stanley" />
    <meta property="og:url" content="https://alecstanley-git.github.io/portfolio/" />
    <meta property="og:title" content="Alec Stanley — technical portfolio" />
    <meta
      property="og:description"
      content="Aerospace engineering (Honours) and astrophysics at Monash University. CFD, orbital mechanics, simulation and robotics projects."
    />
    <meta property="og:image" content="https://alecstanley-git.github.io/portfolio/og-image.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Alec Stanley" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://alecstanley-git.github.io/portfolio/og-image.jpg" />

    <link rel="canonical" href="https://alecstanley-git.github.io/portfolio/" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
