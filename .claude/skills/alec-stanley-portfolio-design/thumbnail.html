<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>body{margin:0;width:1280px;height:854px;display:flex;overflow:hidden}

.mark{font:var(--weight-bold) 132px/1 var(--font-display);letter-spacing:-0.03em;color:var(--hull-1000);white-space:nowrap}
.strip{width:25%;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style></head><body>
<div class="main"><span class="mark">Alec Stanley</span></div>
<div class="strip">
<span style="background:var(--state-warn)"></span>
<span style="background:var(--state-ok)"></span>
<span style="background:var(--plasma-500)"></span>
<span style="background:var(--ignition-700)"></span>
</div>
</body></html>
