<!-- @dsCard group="Effects" viewport="700x150" name="Backdrops" subtitle="Blueprint grid — the page backdrop — plus scanline texture and blurred panel" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="gap:12px">
<div style="flex:1;height:100px;background-color:var(--surface-page);background-image:var(--bg-grid-image);background-size:var(--grid-size) var(--grid-size);border:1px solid var(--border-hairline);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--bg-grid · page backdrop</div>
<div style="flex:1;height:100px;background:var(--surface-card) var(--bg-scanline);border:1px solid var(--border-hairline);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--bg-scanline</div>
<div style="flex:1;height:100px;background:rgba(8,11,16,.72);backdrop-filter:var(--blur-panel);border:1px solid var(--border-hairline);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--blur-panel</div></div></body></html>
