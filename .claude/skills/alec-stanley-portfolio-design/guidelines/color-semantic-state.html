<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="ok / warn / fail / idle — reserved for project state, never decoration" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="height:100%"><div class="sw" style="background:var(--state-ok);color:#05070a"><span>ok · complete</span><span style="opacity:.7">--state-ok</span></div><div class="sw" style="background:var(--state-warn);color:#05070a"><span>warn · in progress</span><span style="opacity:.7">--state-warn</span></div><div class="sw" style="background:var(--state-fail);color:#05070a"><span>fail · blocked</span><span style="opacity:.7">--state-fail</span></div><div class="sw" style="background:var(--state-idle);color:#eef1f5"><span>idle · archived</span><span style="opacity:.7">--state-idle</span></div><div class="sw" style="background:var(--plasma-500);color:#05070a"><span>plasma · data</span><span style="opacity:.7">--plasma-500</span></div></div></body></html>
