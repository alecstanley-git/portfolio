<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="Damped, never bouncy — durations and easing curves" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="col" style="gap:8px">
<div class="row" style="gap:16px" class="mono"><span class="mono">instant 80ms</span><span class="mono">fast 140ms</span><span class="mono">base 220ms</span><span class="mono">slow 420ms</span><span class="mono">reveal 700ms</span></div>
<div class="mono" style="line-height:1.9">--ease-standard &nbsp;cubic-bezier(0.2, 0, 0, 1) &nbsp;· default for controls<br>--ease-out &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cubic-bezier(0.16, 1, 0.3, 1) · entrances, card lift<br>--ease-in &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cubic-bezier(0.7, 0, 0.84, 0) · exits only</div>
<div style="height:6px;background:var(--hull-800);border-radius:3px;overflow:hidden"><div style="height:100%;width:40%;background:var(--ignition-500);animation:sweep 2.4s var(--ease-standard) infinite"></div></div>
<style>@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style></div></body></html>
