<!-- @dsCard group="Colors" viewport="700x150" name="Ignition accent" subtitle="The single signal colour — actions, active state, one highlight per view" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="height:100%"><div class="sw" style="background:var(--ignition-700);color:#ffe0d1"><span>700</span><span style="opacity:.7">--ignition-700</span></div><div class="sw" style="background:var(--ignition-600);color:#ffe0d1"><span>600</span><span style="opacity:.7">--ignition-600</span></div><div class="sw" style="background:var(--ignition-500);color:#05070a"><span>500 · base</span><span style="opacity:.7">--ignition-500</span></div><div class="sw" style="background:var(--ignition-400);color:#05070a"><span>400</span><span style="opacity:.7">--ignition-400</span></div><div class="sw" style="background:var(--ignition-300);color:#05070a"><span>300</span><span style="opacity:.7">--ignition-300</span></div><div class="sw" style="background:var(--ignition-100);color:#05070a"><span>100</span><span style="opacity:.7">--ignition-100</span></div>
<div class="sw" style="background:var(--ignition-tint);color:var(--ignition-400)"><span>tint 12%</span><span style="opacity:.7">--ignition-tint</span></div>
<div class="sw" style="background:var(--ignition-tint-strong);color:var(--ignition-300)"><span>tint 24%</span><span style="opacity:.7">--ignition-tint-strong</span></div></div></body></html>
