<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:170px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="gap:14px"><div style="flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--inner-top)"></div><div class="mono" style="margin-top:8px">rest<br>--inner-top</div></div><div style="flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="mono" style="margin-top:8px">sm<br>--shadow-sm</div></div><div style="flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div class="mono" style="margin-top:8px">hover<br>--shadow-md</div></div><div style="flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div class="mono" style="margin-top:8px">overlay<br>--shadow-lg</div></div><div style="flex:1"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-accent)"></div><div class="mono" style="margin-top:8px">accent<br>--shadow-accent</div></div></div></body></html>
