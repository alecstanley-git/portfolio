<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="height:100%"><div class="sw" style="background:var(--hull-1000);color:#8493a6"><span>1000</span><span style="opacity:.7">--hull-1000</span></div><div class="sw" style="background:var(--hull-900);color:#8493a6"><span>900</span><span style="opacity:.7">--hull-900</span></div><div class="sw" style="background:var(--hull-800);color:#8493a6"><span>800</span><span style="opacity:.7">--hull-800</span></div><div class="sw" style="background:var(--hull-700);color:#b3bfcd"><span>700</span><span style="opacity:.7">--hull-700</span></div><div class="sw" style="background:var(--hull-600);color:#b3bfcd"><span>600</span><span style="opacity:.7">--hull-600</span></div><div class="sw" style="background:var(--hull-500);color:#dde3ea"><span>500</span><span style="opacity:.7">--hull-500</span></div><div class="sw" style="background:var(--hull-400);color:#05070a"><span>400</span><span style="opacity:.7">--hull-400</span></div><div class="sw" style="background:var(--hull-300);color:#05070a"><span>300</span><span style="opacity:.7">--hull-300</span></div><div class="sw" style="background:var(--hull-200);color:#05070a"><span>200</span><span style="opacity:.7">--hull-200</span></div><div class="sw" style="background:var(--hull-100);color:#05070a"><span>100</span><span style="opacity:.7">--hull-100</span></div><div class="sw" style="background:var(--hull-050);color:#05070a"><span>050</span><span style="opacity:.7">--hull-050</span></div></div></body></html>
