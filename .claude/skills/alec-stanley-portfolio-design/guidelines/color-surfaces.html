<!-- @dsCard group="Colors" viewport="700x150" name="Surface aliases" subtitle="Semantic surfaces — always use these, not raw hull steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="height:100%"><div class="sw" style="background:var(--surface-inset);color:var(--text-muted)"><span>inset</span><span style="opacity:.7">--surface-inset</span></div><div class="sw" style="background:var(--surface-page);color:var(--text-muted)"><span>page</span><span style="opacity:.7">--surface-page</span></div><div class="sw" style="background:var(--surface-panel);color:var(--text-muted)"><span>panel</span><span style="opacity:.7">--surface-panel</span></div><div class="sw" style="background:var(--surface-card);color:var(--text-muted)"><span>card</span><span style="opacity:.7">--surface-card</span></div><div class="sw" style="background:var(--surface-raised);color:var(--text-muted)"><span>raised</span><span style="opacity:.7">--surface-raised</span></div>
<div class="sw" style="background:var(--surface-invert);color:var(--hull-900)"><span>invert</span><span style="opacity:.7">--surface-invert</span></div></div></body></html>
