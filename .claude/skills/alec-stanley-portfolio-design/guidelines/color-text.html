<!-- @dsCard group="Colors" viewport="700x150" name="Text aliases" subtitle="Four levels of emphasis, plus link and accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="col" style="gap:10px">
<span style="font:var(--weight-bold) var(--text-xl)/1.1 var(--font-display);color:var(--text-primary)">Primary — headings <span class="mono">--text-primary</span></span>
<span style="font:var(--type-body);color:var(--text-body)">Body — running prose <span class="mono">--text-body</span></span>
<span style="font:var(--type-body-sm);color:var(--text-muted)">Muted — summaries, ledes <span class="mono">--text-muted</span></span>
<span style="font:var(--type-mono);color:var(--text-faint)">FAINT — METADATA, UNITS, STAMPS · --text-faint</span>
<span style="font:var(--type-body-sm)"><a href="#">Link colour</a> <span class="mono">--text-link → --text-link-hover</span></span></div></body></html>
