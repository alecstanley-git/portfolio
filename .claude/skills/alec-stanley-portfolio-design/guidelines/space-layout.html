<!-- @dsCard group="Spacing" viewport="700x150" name="Layout containers" subtitle="Max widths, gutters and section rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="col" style="gap:10px">
<div style="display:flex;align-items:center;gap:10px"><span class="mono" style="width:130px">--container-max</span><span style="height:14px;width:100%;max-width:400px;background:var(--hull-700);border-radius:2px"></span><span class="mono">1180px</span></div>
<div style="display:flex;align-items:center;gap:10px"><span class="mono" style="width:130px">--container-narrow</span><span style="height:14px;width:265px;background:var(--hull-700);border-radius:2px"></span><span class="mono">780px</span></div>
<div style="display:flex;align-items:center;gap:10px"><span class="mono" style="width:130px">--measure</span><span style="height:14px;width:230px;background:var(--hull-700);border-radius:2px"></span><span class="mono">68ch</span></div>
<div style="display:flex;gap:18px;padding-top:6px" class="mono"><span>--gutter 24px</span><span>--gutter-lg 40px</span><span>--section-y 96px</span></div></div></body></html>
