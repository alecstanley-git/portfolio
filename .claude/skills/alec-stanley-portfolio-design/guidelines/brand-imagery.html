<!-- @dsCard group="Brand" viewport="700x190" name="Imagery treatment" subtitle="Cool, desaturated, hairline-framed; portrait is the only person shot" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:190px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="gap:14px;align-items:center">
<img src="../assets/portrait-alec.png" alt="Alec Stanley" style="width:130px;height:130px;border-radius:50%;border:1px solid var(--border-line);filter:saturate(.85)">
<div class="col" style="gap:8px">
<span style="font:var(--type-body-sm);color:var(--text-body);max-width:44ch">Photography runs cool and slightly desaturated (<span class="mono">saturate(0.85)</span>), lifting to full saturation only on hover. Frame with a hairline border, never a drop shadow.</span>
<span class="mono">Diagrams, plots and CAD renders sit on --surface-inset with the blueprint grid behind them.</span></div></div></body></html>
