<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Machined, not soft — 10px is the ceiling for cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="gap:12px"><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-xs)"></div><div class="mono" style="margin-top:6px">--radius-xs<br>2px</div></div><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-sm)"></div><div class="mono" style="margin-top:6px">--radius-sm<br>4px</div></div><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-md)"></div><div class="mono" style="margin-top:6px">--radius-md<br>6px</div></div><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-lg)"></div><div class="mono" style="margin-top:6px">--radius-lg<br>10px</div></div><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-xl)"></div><div class="mono" style="margin-top:6px">--radius-xl<br>14px</div></div><div style="flex:1"><div style="height:64px;background:var(--hull-800);border:1px solid var(--border-line);border-radius:var(--radius-pill)"></div><div class="mono" style="margin-top:6px">--radius-pill<br>999px</div></div></div></body></html>
