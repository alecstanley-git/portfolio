<!-- @dsCard group="Colors" viewport="700x150" name="Borders & rules" subtitle="Three border weights plus the blueprint grid line" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;height:150px;overflow:hidden}.row{display:flex;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.mono{font:var(--type-mono);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);font:var(--type-label);min-height:64px}</style></head><body><div class="row" style="gap:12px;height:100%">
<div style="flex:1;border:1px solid var(--border-hairline);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--border-hairline</div>
<div style="flex:1;border:1px solid var(--border-line);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--border-line</div>
<div style="flex:1;border:1px solid var(--border-strong);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px" class="mono">--border-strong</div>
<div style="flex:1;border:1px solid var(--border-hairline);border-radius:var(--radius-card);background:var(--bg-grid);display:flex;align-items:flex-end;padding:8px" class="mono">--bg-grid</div></div></body></html>
